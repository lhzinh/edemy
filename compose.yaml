services:
  server:
    build:
      context: ./server
      dockerfile: ./Dockerfile
      target: development
    ports:
      - 8000:8000
    env_file:
      - ./server/.env
    develop:
      watch:
        # Sync source file changes directly into the container so Django's
        # dev server can reload them without a full image rebuild.
        - action: sync
          path: ./server
          target: /app
          ignore:
            - __pycache__/
            - "*.pyc"
            - .git/
            - .venv/
        # Rebuild the image when dependencies change.
        - action: rebuild
          path: ./server/pyproject.toml
        - action: rebuild
          path: ./server/uv.lock

  client:
    build:
      context: ./client
      dockerfile: ./Dockerfile
      target: development
    ports:
      - 3000:3000
    env_file:
      - ./client/.env
    environment:
      - WATCHPACK_POLLING=true
      - INNGEST_BASE_URL=http://inngest:8288
    develop:
      watch:
        # Sync source file changes directly into the container so Nextjs's
        # dev server can reload them without a full image rebuild.
        - action: sync
          path: ./client
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .next/
        # Rebuild the image when dependencies change.
        - action: rebuild
          path: ./client/package.json

  inngest:
    image: inngest/inngest
    command: 'inngest dev -u http://server:8000/api/inngest'
    ports:
      - 8288:8288
      - 8289:8289
    depends_on:
      - server