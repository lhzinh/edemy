[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.3",
    "django-cors-headers>=4.9.0",
    "django-crispy-forms>=2.7",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "markdown>=3.11.3",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "django-silk>=5.6.0",
    "ruff>=0.17.4",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-factoryboy>=2.8.1",
    "django-stubs>=6.1.2",
    "pyrefly>=1.4.1",
    "djangorestframework-stubs>=3.18.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--maxfail=1", 
    "--strict-markers", 
    "--strict-config", 
    "-reuse-db", 
    "--create-db", 
    "--no-migrations"
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["**/migrations/"]

[tool.ruff.lint]
extend-select = [
    "DJ",       # flake8-django: Django-specific bugs
    "E",        # pycodestyle errors
    "F",        # Pyflakes
    "W",        # pycodestyle warnings
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "NPY",      # Some numpy-specific things
    "FURB",     # Suggest more idiomatic Python patterns,
    "S",    # flake8-bandit security rules
]
ignore = [
    "E501",  # line length (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "RUF012"]
"**/settings/*.py" = ["E501", "F403", "F405"]
"**/tests/*.py" = ["S101"]
"**/models.py" = ["RUF012"]
"**/serializers.py" = ["RUF012"]
"**/admin.py" = ["RUF012"]
"**/forms.py" = ["RUF012"]
"**/views.py" = ["RUF012"]
"**/filters.py" = ["RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
server = { workspace = true, editable = true }

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
project-excludes = [
    "**/migrations/**",
    "**/tests/**",
]

[tool.pyrefly.errors]
missing-attribute = false
