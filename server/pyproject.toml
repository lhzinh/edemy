[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "pyrefly>=1.5.0",
    "ruff>=0.17.6",
]

[tool.ruff]
extend-exclude = ["**/migrations/"]

[tool.ruff.lint]
extend-select = [
    "DJ",       # flake8-django: Django-specific bugs
    "E",        # pycodestyle errors
    "F",        # Pyflakes
    "W",        # pycodestyle warnings
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "RUF012"]
"**/settings/*.py" = ["E501", "F403", "F405"]
"**/tests/test_*.py" = ["S101"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
project-excludes = [
    "**/migrations/**",
]

[tool.pyrefly.errors]
missing-attribute = false