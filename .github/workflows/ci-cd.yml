name: CI/CD

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/ci-cd.yml"
      - "docker-bake.hcl"
      - "client/**"
      - "server/**"
      - "compose.prod.yaml"
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
    paths:
      - ".github/workflows/ci-cd.yml"
      - "docker-bake.hcl"
      - "client/**"
      - "server/**"
      - "compose.prod.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-images:
    name: Build and publish Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image version
        id: version
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" ]]; then
            echo "Repository variable DOCKERHUB_USERNAME is required." >&2
            exit 1
          fi
          namespace="${DOCKERHUB_USERNAME,,}"
          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "channel=release-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            echo "channel=local" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish images with Bake
        uses: docker/bake-action@v7
        with:
          source: .
          files: ./docker-bake.hcl
          targets: default
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          provenance: true
          sbom: true
          pull: true
          vars: |
            IMAGE_NAMESPACE=${{ steps.version.outputs.namespace }}
            IMAGE_TAG=${{ steps.version.outputs.tag }}
            IMAGE_SHA=sha-${{ steps.version.outputs.sha }}
            IMAGE_CHANNEL=${{ steps.version.outputs.channel }}
            GIT_SHA=${{ github.sha }}
